{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>

    {% comment %} bootstrap {% endcomment %} 
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    {% comment %} css {% endcomment %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header class="header sticky-top">
        <div class="header-container d-flex">
            <navbar class="header-nav pt-4">
                <ul class="header-list d-flex">
                    <li>
                        <a href="{% url 'main:index' %}" class="nav-a m-3">Home</a>
                    </li>
                    <li>
                        <a href="{% url 'main:products_list' %}" class="nav-a m-3">Shop</a>
                    </li>
                </ul>
            </navbar>
            <div class="header-logo">
                <p class="heavy-logo">CASTRO SMITH</p>
                <a href="{% url 'main:index' %}" class ="heavy-logo">CASTRO SMITH</a>
            </div>
            <div class="header-profile pt-2">
                <a href="#" class="href">Profile</a>
            </div>
        </div>
    </header>
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
    <img src="{% static 'img/frame1.png' %}" class="frame1" alt="">
    <img src="{% static 'img/frame2.png' %}" class="frame2" alt="">
    <img src="{% static 'img/frame3.png' %}" class="frame3" alt="">
    <img src="{% static 'img/frame4.png' %}" class="frame4" alt="">

    {% comment %} js for boorstrap {% endcomment %}
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
